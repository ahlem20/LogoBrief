<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Logo Brief — ahlem studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600;800&family=Montserrat:wght@200;300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#4a1bd0;--panel:#9455f8;--field:rgba(25,0,100,.38);--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:56px!important;background:#2a0f80;font-family:Montserrat,Cairo,Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 12px}
.slide{position:relative;width:100%;max-width:1100px;aspect-ratio:1.6;background:var(--bg);overflow:hidden;container-type:inline-size;font-size:1.25cqw}
.ph{position:absolute;background-size:cover;background-position:center}
.pill{position:absolute;inset-inline-start:4%;top:7%;bottom:7%;width:5.5%;background:var(--panel);border-radius:2cqw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1.4cqw 0}
.pill b{font-size:2.4cqw;font-weight:800}.pill span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:1.9cqw;font-weight:300}
.pill span i{font-style:normal;font-weight:600}
.h{display:inline-block;font-size:1.5cqw;padding-bottom:.5cqw;border-bottom:.2cqw solid var(--panel);border-end-end-radius:1cqw}
.h b{font-weight:800}.h{font-weight:300}
.brand{position:absolute;inset-inline-end:1.5cqw;bottom:1.5cqw;writing-mode:vertical-rl;transform:rotate(180deg);font-size:2.6cqw;font-weight:800}
.arrow{position:absolute;inset-inline-start:3cqw;bottom:2cqw;font-size:2.4cqw}
label,.lb{font-weight:800;font-size:1.05cqw}
input[type=text],input[type=email],input[type=tel],textarea{background:var(--field);border:0;border-radius:.4cqw;color:#fff;font:inherit;font-size:1.1cqw;padding:.6cqw .8cqw;width:100%}
input:focus,textarea:focus{outline:2px solid #fff}
.row{display:flex;align-items:center;gap:1cqw;margin-bottom:1.3cqw}.row>label{width:10cqw;flex:none}
.opts{display:flex;gap:2cqw;flex-wrap:wrap;font-weight:300;font-size:1.05cqw}
.opts label{font-weight:300;font-size:1.05cqw;display:flex;gap:.5cqw;align-items:center;cursor:pointer}
input[type="radio"] {  appearance: none;
  width: 1cqw;
  height: 1cqw;
  border-radius: 50%;
  border: 2px solid var(--field);
  background: #2a0f80;
  margin: 0;
  cursor: pointer;
}

input[type="radio"]:checked {
  background: #fff;
  border-radius: 50%;
}
input[type="checkbox"] {
  appearance: none;
  width: 1cqw;
  height: 1cqw;
  border-radius: 50%;
  border: 2px solid #2a0f80;
  background: #2a0f80;
  margin: 0;
  cursor: pointer;
  position: relative;
}

input[type="checkbox"]:checked {
  background: #2a0f80;
  border-color: #2a0f80;
}

input[type="checkbox"]:checked::after {
  content: "";
  position: absolute;
  width: 35%;
  height: 55%;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(45deg);
  left: 30%;
  top: 15%;
}
/* slide 1 */
.s1 .ph{inset-inline-start:50%;inset-inline-end:0;top:0;bottom:0;filter:saturate(.35) brightness(.7)}
.s1 .big{position:absolute;inset-inline-start:10%;top:11%;inset-inline-end:5%;bottom:11%;background:rgba(148,85,248,.88);border-radius:3cqw}
.s1 h1{position:absolute;inset-inline-start:3.5cqw;top:5cqw;margin:0;font-size:12.5cqw;line-height:.88;letter-spacing:-.4cqw;font-weight:800}
.s1 h1 em{font-style:normal;font-weight:200}
.s1 .d{position:absolute;inset-inline-end:2cqw;bottom:1.5cqw;font-size:1.5cqw;font-weight:300}
/* slide 2 */
.s2 .ph{inset-inline-start:58.5%;inset-inline-end:0;top:0;bottom:0}
.s2 .f{position:absolute;inset-inline-start:4%;width:52%}
/* slide 3 */
.up{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw}
.up label{aspect-ratio:1.45;background:var(--field);border-radius:.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqw;font-weight:300;font-size:.9cqw;cursor:pointer;overflow:hidden;text-align:center;padding:.4cqw}
.up label:hover{background:rgba(25,0,100,.55)}.up svg{width:2.2cqw;height:2.2cqw;stroke:#fff;fill:none;stroke-width:1.6}
.deadline-row {
    margin-top: 1.8cqw;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5cqw;
    margin-bottom: 1.5cqw;
}

.deadline-row label {
     width: auto;
     flex: none;
}

.date-field {
    position: relative;
    width: 18cqw;
}

.date-field input {
  width: 100%;
  height: 3.2cqw;
  box-sizing: border-box;

  padding: 0 3cqw 0 1cqw;

  border: 1px solid rgba(0, 0, 0, 0.18);
  border-radius: 0.7cqw;

  background: var(--field);
  color: var(--text);

  font: inherit;
  font-size: 1.1cqw;

  outline: none;
  cursor: pointer;
}

.date-field input:focus {
  border-color: var(--accent);
}

.date-field input::-webkit-calendar-picker-indicator {
  opacity: 0;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

.calendar-icon {
  position: absolute;
  right: 0.8cqw;
  pointer-events: none;
  font-size: 1.2cqw;
  opacity: 0.65;
}
.up input{display:none}
.up label {
  position: relative;
  aspect-ratio: 1.45;
  background: var(--field);
  border-radius: .6cqw;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: .5cqw;
  font-weight: 300;
  font-size: .9cqw;
  cursor: pointer;
  overflow: hidden;
  text-align: center;
  padding: .4cqw;
}
.up label img.upload-preview {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
  border-radius: .5cqw;
}

.up label.has-image {
  padding: 0;
}

.up label.has-image svg,
.up label.has-image span {
  display: none;
}
/* slide 4 */
.s4 .ph{inset-inline-end:4%;top:6%;bottom:6%;width:31%;border-radius:3cqw}
.s4 .ty{
  position:absolute;
  inset-inline-start:16%;   /* same left edge as the contact block */
  top:14%;
  font-size:7cqw;
  font-weight:200;
  opacity:.35;
  line-height:1;
  white-space:nowrap;
}
.s4 .c{position:absolute;inset-inline-start:16%;top:40%;font-weight:300;font-size:1.35cqw;line-height:1.7}
.btn{font:inherit;font-weight:600;font-size:1.5cqw;border:0;border-radius:.5cqw;padding:.4cqw 1.2cqw;cursor:pointer;margin-right:.8cqw;margin-bottom:1.2cqw;background:#c9a8ff;color:#4a1bd0}
.btn.p{background:var(--panel);color:#fff}.btn:focus-visible{outline:2px solid #fff}
.rotated-logo {
  transform: rotate(-90deg);
   width: 20px;
  object-fit: contain;
}
.lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:12px;z-index:5;font:inherit;font-size:14px;font-weight:600;padding:.5em 1.1em;border-radius:99px;border:0;background:#9455f8;color:#fff;cursor:pointer}
#apps label{font-weight:600}#apps input{accent-color:#fff}
html[dir=rtl] *{letter-spacing:0!important}
html[dir=rtl] .s1 h1{font-size:11cqw;line-height:1.15;top:4cqw}html[dir=rtl] .s1 h1 em{font-weight:300}
@media print{.lang{display:none}}
@media print{body{background:#fff;padding:0}.slide{break-inside:avoid}}
@media (prefers-color-scheme:dark){body{background:#1d0a5c}}
/* ============ RESPONSIVE (tablet / phone) ============ */
@media (max-width:900px){
  body{padding-inline:8px;padding-bottom:24px;gap:14px}
  .slide{aspect-ratio:auto;font-size:16px;border-radius:18px}
  .brand,.arrow{display:none}

  /* shared pill + logo */
  .pill{inset-inline-start:12px;width:44px;top:20px;bottom:20px;border-radius:22px;padding:10px 0}
  .pill span{font-size:15px}
  .rotated-logo{width:24px}

  /* shared form controls */
  label,.lb{font-size:14px}
  input[type=text],input[type=email],input[type=tel],textarea{font-size:16px;padding:11px 12px;border-radius:10px}
  .row{flex-direction:column;align-items:stretch!important;gap:6px;margin-bottom:14px}
  .row>label{width:auto!important;margin-inline-start:0!important}
  .opts{gap:10px 16px;font-size:14px}
  .opts label{font-size:14px;gap:8px}
  input[type=radio],input[type=checkbox]{width:18px;height:18px;flex:none}
  .h{font-size:16px;padding-bottom:4px;border-bottom-width:2px;border-end-end-radius:10px}

  /* slide 1 */
  .s1{min-height:520px}
  .s1 .ph{inset:0}
  .s1 .big{inset-inline-start:72px;inset-inline-end:14px;top:36px;bottom:36px;border-radius:26px}
  .s1 h1{inset-inline-start:20px;top:24px;font-size:18vw;letter-spacing:-1px}
  html[dir=rtl] .s1 h1{font-size:15vw;line-height:1.15;top:20px}
  .s1 .d{inset-inline-end:16px;bottom:14px;font-size:14px}

  /* slide 2 */
  .s2{padding-bottom:24px}
  .s2 .ph{position:relative;inset:auto;width:100%;height:130px}
  .s2 .f{position:static;width:auto;padding:8px 18px 0}
  .s2 .f[style*="text-align"]{text-align:start!important;padding-top:20px}

  /* slide 3 */
  .s3{padding:20px 18px 28px}
  .s3 .h{font-size:14px!important}
  .s3>div{position:static!important;width:auto!important;margin-bottom:22px}
  .s3 div[style*="text-align"]{text-align:start!important;margin-bottom:12px!important}
  .s3 .opts{margin-inline-start:0!important;gap:12px!important}
  .up{grid-template-columns:repeat(3,1fr);gap:10px}
  .up label{font-size:12px;gap:6px;border-radius:10px;padding:6px}
  .up svg{width:26px;height:26px}
  .up label img.upload-preview{border-radius:8px}
  .deadline-row{flex-direction:column;align-items:stretch;gap:6px;margin-top:16px;margin-bottom:14px}
  .date-field{width:100%}
  .date-field input{height:46px;font-size:16px;border-radius:10px;padding:0 40px 0 12px}
  .calendar-icon{font-size:18px;right:14px}

  /* slide 4 */
  .s4{padding-bottom:20px}
  .s4 .ph{position:relative;inset:auto;width:auto;height:210px;margin-block-start:18px;margin-inline:70px 16px;border-radius:24px}
  .s4 .ty{position:static;padding:20px 16px 6px;padding-inline:70px 16px;font-size:clamp(40px,11vw,90px)}
  .s4 .c{position:static;padding:8px 16px 8px;padding-inline:70px 16px;font-size:16px;line-height:1.9}
  .btn{font-size:16px;padding:10px 20px;border-radius:10px;margin-right:0;margin-inline-end:10px;margin-bottom:12px}
}
</style>

<script>
(function () {
  var btn = document.getElementById('dlpdf');
  var PAGE_W = 1100; // same as .slide max-width

 function prepareClone(doc) {
    var isRtl = document.documentElement.dir === 'rtl';
    var win = doc.defaultView;

    // text-like inputs + textarea -> div showing the value
    var sel = 'input[type=text],input[type=email],input[type=tel],input[type=date],textarea';
    var origs = document.querySelectorAll(sel);
    var clones = doc.querySelectorAll(sel);
    clones.forEach(function (c, i) {
      var o = origs[i];
      var cs = win.getComputedStyle(c);          // measure the clone (1200px layout), not the live page
      var val = o.value || '';
      if (o.type === 'date' && val) {
        var p = val.split('-');
        val = p[2] + ' / ' + p[1] + ' / ' + p[0];
      }
      var isTA = o.tagName === 'TEXTAREA';
      var d = doc.createElement('div');
      d.textContent = val;
      d.style.cssText =
        'box-sizing:border-box;display:block;overflow:hidden;' +
        'width:' + c.offsetWidth + 'px;height:' + c.offsetHeight + 'px;' +
        'background-color:' + cs.backgroundColor + ';' +
        'border-radius:' + cs.borderTopLeftRadius + ';' +
        'color:#fff;font-family:' + cs.fontFamily + ';' +
        'font-size:' + cs.fontSize + ';' +
        'line-height:' + (isTA ? '1.4' : (c.offsetHeight + 'px')) + ';' +
        'padding:' + (isTA ? '6px 8px' : '0 8px') + ';' +
        'white-space:pre-wrap;direction:' + (isRtl ? 'rtl' : 'ltr') + ';' +
        'text-align:' + (isRtl ? 'right' : 'left') + ';';
      c.parentNode.replaceChild(d, c);
    });

    // checkboxes -> simple circles with a check mark
    var cbO = document.querySelectorAll('input[type=checkbox]');
    doc.querySelectorAll('input[type=checkbox]').forEach(function (c, i) {
      var o = cbO[i];
      var s = c.offsetWidth || 14;
      var d = doc.createElement('span');
      d.style.cssText =
        'display:inline-block;box-sizing:border-box;border-radius:50%;background:#2a0f80;' +
        'width:' + s + 'px;height:' + s + 'px;position:relative;';
      if (o.checked) {
        var k = doc.createElement('span');
        k.style.cssText =
          'position:absolute;left:' + (s * 0.32) + 'px;top:' + (s * 0.12) + 'px;' +
          'width:' + (s * 0.3) + 'px;height:' + (s * 0.55) + 'px;' +
          'border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);';
        d.appendChild(k);
      }
      c.parentNode.replaceChild(d, c);
    });

    // uploaded previews -> background-image div
    doc.querySelectorAll('img.upload-preview').forEach(function (img) {
      var d = doc.createElement('div');
      d.style.cssText =
        'width:100%;height:100%;background:url("' + img.src + '") center/contain no-repeat;';
      img.parentNode.replaceChild(d, img);
    });
  }

  function renderSlide(slide, skipLogos) {
    return html2canvas(slide, {
      scale: 2,
      useCORS: true,
      allowTaint: false,
      backgroundColor: '#4a1bd0',
      logging: false,
      windowWidth: 1200,
      onclone: prepareClone,
      ignoreElements: function (el) {
        if (el.tagName !== 'IMG') return false;
        return skipLogos || !el.complete || el.naturalWidth === 0;
      }
    });
  }

  btn.addEventListener('click', async function () {
    var oldHTML = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = '…';

    try {
      if (typeof html2canvas === 'undefined' || !window.jspdf || !window.jspdf.jsPDF) {
        throw new Error('PDF libraries did not load. Check your internet connection.');
      }
      if (document.fonts && document.fonts.ready) await document.fonts.ready;

      var jsPDF = window.jspdf.jsPDF;
      var slides = document.querySelectorAll('.slide');
      var pdf = null;

      for (var i = 0; i < slides.length; i++) {
        var canvas = await renderSlide(slides[i], false);
        var data;
        try {
          data = canvas.toDataURL('image/jpeg', 0.92);
        } catch (e) {
          // tainted canvas (usually logo.png on file://) -> retry without the logo
          canvas = await renderSlide(slides[i], true);
          data = canvas.toDataURL('image/jpeg', 0.92);
        }

        var w = PAGE_W;
        var h = Math.round(PAGE_W * canvas.height / canvas.width);

        if (!pdf) {
          pdf = new jsPDF({
            orientation: 'landscape',
            unit: 'px',
            format: [w, h],
            compress: true,
            hotfixes: ['px_scaling']
          });
        } else {
          pdf.addPage([w, h], 'landscape');
        }
        pdf.addImage(data, 'JPEG', 0, 0, w, h, undefined, 'FAST');
      }

      var name = (document.getElementById('pn').value || '').trim() || 'logo-brief';
      name = name.replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '-');
      pdf.save('logo-brief-' + name + '.pdf');

    } catch (err) {
      console.error('PDF creation error:', err);
      alert('PDF creation failed:\n\n' + (err && err.message ? err.message : err));
    } finally {
      btn.disabled = false;
      btn.innerHTML = oldHTML;
    }
  });
})();
</script>
